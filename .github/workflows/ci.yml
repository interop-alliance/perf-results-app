name: CI

# Type-checks, lints, checks formatting, tests and builds every push and pull
# request: `pnpm check`, the same command a contributor runs.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '24'

      # Provision pnpm via Corepack (bundled with Node) from the
      # `packageManager` pin in package.json.
      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check
        run: pnpm check
